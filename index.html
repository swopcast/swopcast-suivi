<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E2119">
<title>Swopcast · Suivi des tâches</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E2119'/%3E%3Cpath d='M20 34a12 12 0 0 0 24 0M32 46v8M24 54h16' stroke='%23E0AE4F' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Crect x='25' y='10' width='14' height='26' rx='7' fill='%23E0AE4F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Palette tirée des rendus du studio : murs sombres, tasseaux noyer, parquet clair,
   fauteuils cognac, tapis beige, plantes, lumière chaude 2700-3000 K, teal du plan de régie. */
:root{
  --bg:#EFE4D3;--bg-deep:#E4D5BF;--paper:#FAF4E8;--field:#FFFBF2;--line:#DBCBB3;--line-strong:#BCA687;
  --ink:#3B3029;--ink-strong:#1F1914;--muted:#6B5E52;
  --wood:#2E2119;--wood-2:#3B2A1F;--cream:#F3E9DB;--on-accent:#FFF8EE;
  --accent:#A4531F;--accent-dark:#86421A;--accent-text:#86421A;--accent-soft:#F0D9C6;
  --wine:#8E2B2B;--wine-soft:#F2D8D3;--wine-text:#7A2323;
  --amber:#E0AE4F;--amber-soft:#F5E1B4;--amber-text:#6A470B;--amber-line:#D9A441;
  --green:#3F7A47;--green-soft:#DCE8D3;--teal:#35707F;--we:#F4EADA;--toast-action:#F3B58A;--sel-bg:#2E2119;--sel-ink:#F3E9DB;--avatar-bg:#3B2A1F;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(60,40,20,.07),0 6px 20px rgba(60,40,20,.08);
  --font-title:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --page-pad:clamp(12px,3vw,28px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1613;--bg-deep:#2B231D;--paper:#241E19;--field:#1B1613;--line:#3A3027;--line-strong:#5A4A3B;
  --ink:#E4D6C2;--ink-strong:#F8F0E2;--muted:#A39482;
  --wood:#17110D;--wood-2:#241A13;
  --accent:#B05A25;--accent-dark:#C26A33;--accent-text:#F0A872;--accent-soft:#3A271A;
  --wine:#B8453F;--wine-soft:#3A1F1C;--wine-text:#F2B1A7;
  --amber-soft:#3B2E15;--amber-text:#EBC56E;--amber-line:#B88A32;
  --green:#4F9358;--green-soft:#223022;--teal:#4A93A5;--we:#1F1915;
  --sel-bg:#F3E9DB;--sel-ink:#2E2119;--avatar-bg:#5A4636;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-text);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-title);color:var(--ink-strong);margin:0;line-height:1.2}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(224,174,79,.7);outline-offset:2px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid transparent;border-radius:999px;font:600 14px/1 var(--font-title);letter-spacing:.01em;background:var(--paper);color:var(--ink-strong);transition:background-color .15s,border-color .15s;white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.btn--accent{background:var(--accent);color:var(--on-accent)}.btn--accent:hover{background:var(--accent-dark)}
.btn--ghost{background:transparent;border-color:var(--line-strong)}.btn--ghost:hover{background:var(--bg-deep)}
.btn--danger{background:transparent;color:var(--wine-text);border-color:rgba(142,43,43,.4)}.btn--danger:hover{background:var(--wine-soft)}
.btn--small{min-height:32px;padding:0 12px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border:1px solid var(--line-strong);border-radius:50%;background:var(--paper);color:var(--ink-strong)}
.icon-btn:hover{background:var(--bg-deep)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.link{border:0;background:none;padding:0;color:var(--accent-text);text-decoration:underline;font-weight:600}

/* En-tête : tasseaux noyer + filet de lumière chaude */
.topbar{position:sticky;top:0;z-index:20;color:var(--cream);
  background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.28)),repeating-linear-gradient(90deg,var(--wood-2) 0 7px,var(--wood) 7px 10px);
  box-shadow:0 2px 12px rgba(0,0,0,.25)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--amber) 18%,var(--amber) 82%,transparent);opacity:.85}
.topbar__inner{display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;padding:12px var(--page-pad) 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand__logo{width:32px;height:32px;flex:none;border-radius:50%;background:var(--amber);display:grid;place-items:center;color:var(--wood);box-shadow:0 0 16px rgba(224,174,79,.45)}
.brand__logo svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.brand__text{display:flex;flex-direction:column;min-width:0}
.brand__name{font:800 17px/1.15 var(--font-title);letter-spacing:.14em;text-transform:uppercase}
.brand__sub{margin-top:2px;font-size:12px;opacity:.8;white-space:nowrap}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(243,233,219,.85);white-space:nowrap;border:0;background:none;padding:6px}
.sync__dot{width:8px;height:8px;border-radius:50%;background:#8DC088;flex:none}
.sync[data-state="bad"] .sync__dot{background:#E58A78}
.sync[data-state="warn"] .sync__dot{background:#E0B15B}
.topbar__add{margin-left:12px}
.tabs{display:flex;gap:4px;max-width:1280px;margin:0 auto;padding:0 var(--page-pad);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:10px 14px 12px;border:0;background:none;color:rgba(243,233,219,.72);font:600 14.5px/1 var(--font-title);white-space:nowrap}
.tab:hover{color:var(--cream)}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--amber)}
.tab__count{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--wine);color:#fff;font:700 11px/1 var(--font-title);vertical-align:1px}

/* Page */
.page{max-width:1280px;margin:0 auto;padding:16px var(--page-pad) 110px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-width:0}
.toolbar__label{font:600 13px/1 var(--font-title);color:var(--muted);white-space:nowrap}
.people{display:flex;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.people::-webkit-scrollbar{display:none}
.person{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px 0 6px;border:1px solid var(--line-strong);border-radius:999px;background:var(--paper);color:var(--ink-strong);font-weight:600;font-size:14px;white-space:nowrap}
.person--all{padding-left:14px}
.person:hover{border-color:var(--ink)}
.person[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.person[aria-pressed="true"] .avatar{background:var(--accent);color:var(--on-accent)}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;flex:none;border-radius:50%;background:var(--avatar-bg);color:var(--cream);font:700 12px/1 var(--font-title)}

/* Rappels */
.alerts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.alerts__who{font-size:13.5px;color:var(--muted);margin-right:2px}
.alert{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px 0 6px;border:1px solid transparent;border-radius:999px;font-size:14px;font-weight:600;background:var(--paper);color:var(--ink-strong)}
.alert__num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;font:700 13px/1 var(--font-title)}
.alert--late{background:var(--wine-soft);color:var(--wine-text);border-color:rgba(142,43,43,.3)}
.alert--late .alert__num{background:var(--wine);color:#fff}
.alert--soon{background:var(--amber-soft);color:var(--amber-text);border-color:rgba(217,164,65,.5)}
.alert--soon .alert__num{background:var(--amber-text);color:var(--amber-soft)}
.alert--val{background:var(--paper);color:var(--ink-strong);border-color:var(--line-strong)}
.alert--val .alert__num{background:var(--avatar-bg);color:var(--cream)}
.alert:hover{filter:brightness(.97)}
.alert--calm{padding:8px 14px;min-height:0;cursor:default;border-color:var(--line);color:var(--ink);font-weight:400}
.alert--calm strong{font-weight:600}

/* Titres de vue */
.view-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.view-title{font-size:22px;font-weight:700}
.view-sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty{padding:18px;color:var(--muted);text-align:center}

/* Tâches */
.task-list{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:4px 10px;padding:10px 14px 10px 8px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.is-late{box-shadow:inset 4px 0 0 var(--wine)}
.task.is-soon{box-shadow:inset 4px 0 0 var(--amber-line)}
.task__check{display:grid;place-items:center;width:40px;height:40px;margin:-8px -4px -8px 0;cursor:pointer}
.checkbox{appearance:none;-webkit-appearance:none;display:inline-grid;place-content:center;width:22px;height:22px;margin:0;flex:none;border:2px solid var(--line-strong);border-radius:6px;background:var(--field);cursor:pointer;transition:background-color .15s,border-color .15s}
.checkbox::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
.checkbox:hover{border-color:var(--ink)}
.checkbox:checked{background:var(--green);border-color:var(--green)}
.checkbox:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.task.is-late .checkbox:not(:checked){border-color:var(--wine)}
.task__body{min-width:0;padding-top:1px;cursor:pointer;border-radius:6px}
.task__title{color:var(--ink-strong);font-weight:600;line-height:1.4}
.task.is-done .task__title{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(107,94,82,.5);font-weight:400}
.task__meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--muted)}
.task__id{font-weight:700;color:var(--ink)}
.task__rel{font:600 11.5px/1 var(--font-title);padding:3px 6px;border-radius:5px;background:var(--bg-deep);color:var(--ink)}
.task__note{margin:4px 0 0;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.dot--P{background:var(--teal)}.dot--A{background:var(--accent)}.dot--B{background:var(--green)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font:700 11.5px/1.1 var(--font-title);white-space:nowrap}
.badge--late{background:var(--wine);color:#fff}
.badge--soon{background:var(--amber-soft);color:var(--amber-text)}
.badge--quiet{background:var(--bg-deep);color:var(--ink)}
.badge--val{background:var(--field);color:var(--ink-strong);box-shadow:inset 0 0 0 1px var(--ink)}
.badge--prog{background:var(--green);color:#fff}
.badge--block{background:transparent;color:var(--wine-text);box-shadow:inset 0 0 0 1px rgba(142,43,43,.6)}

/* Groupes */
.groups{display:grid;gap:14px}
.group{overflow:hidden}
.group__title{display:flex;align-items:center;gap:10px;padding:13px 16px;font:700 15px/1.2 var(--font-title);color:var(--ink-strong);list-style:none}
summary.group__title{cursor:pointer}
summary.group__title::-webkit-details-marker{display:none}
.group__count{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:var(--bg-deep);font:700 12px/1 var(--font-title);color:var(--ink)}
.group__chev{margin-left:auto;width:18px;height:18px;stroke:var(--muted);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details[open]>.group__title .group__chev{transform:rotate(180deg)}
.group .task-list{border-top:1px solid var(--line)}
.group--late{border-color:rgba(142,43,43,.4)}
.group--late .group__title{color:var(--wine-text);background:var(--wine-soft)}
.group--late .group__count{background:var(--wine);color:#fff}
.group--soon .group__title{color:var(--amber-text);background:var(--amber-soft)}
.group--soon .group__count{background:var(--amber-text);color:var(--amber-soft)}
.group__title:focus{outline:none}
.group__title:focus-visible{outline:3px solid rgba(224,174,79,.7);outline-offset:-3px}
.progress{height:8px;border-radius:4px;background:var(--bg-deep);overflow:hidden;min-width:90px;flex:1;max-width:260px}
.progress i{display:block;height:100%;background:var(--green)}
.group__prog{margin-left:auto;display:flex;align-items:center;gap:10px;font:600 13px var(--font-title);color:var(--muted)}
.group__prog+.group__chev{margin-left:0}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px;margin-bottom:14px}
.sum b{font:800 26px/1 var(--font-title);color:var(--ink-strong)}

/* Calendrier */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:21px;min-width:170px;text-align:center;text-transform:capitalize}
.cal-nav-row{display:flex;align-items:center;gap:8px;min-width:0}
.cal-legend{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.cal__wd{padding:8px 6px;font:700 11px/1 var(--font-title);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.day{min-height:96px;padding:5px;border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n+8){border-left:0}
.day.is-we{background:var(--we)}
.day.is-out{background:var(--bg);color:var(--muted)}
.day.is-out .day__num{opacity:.55}
.day.is-sel{box-shadow:inset 0 0 0 2px var(--amber-line)}
.day__num{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;font:700 12.5px/1 var(--font-title);align-self:flex-start;padding:0 4px}
.day.is-today .day__num{background:var(--accent);color:var(--on-accent)}
.day__flag{font:700 10px/1 var(--font-title);color:var(--amber-text);margin-left:auto}
.day__top{display:flex;align-items:center}
.chip{display:block;padding:2px 6px;border-radius:5px;font:600 11px/1.3 var(--font-title);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip--P{background:var(--teal)}.chip--A{background:var(--accent)}.chip--B{background:var(--green)}
.chip--done{background:var(--bg-deep);color:var(--muted);text-decoration:line-through}
.chip__t{font-weight:500}
.day__more{font-size:11px;color:var(--muted);padding-left:4px}
.day-panel{margin-top:14px;scroll-margin-top:130px}
.day-panel h3{padding:13px 16px;font-size:15px;border-bottom:1px solid var(--line);text-transform:capitalize}
.ms{padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;background:var(--amber-soft);color:var(--amber-text);font-weight:600}

/* Pied de page, FAB */
.footer{max-width:1280px;margin:-80px auto 0;padding:0 var(--page-pad) 100px;font-size:12.5px;color:var(--muted)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:30;display:grid;place-items:center;width:60px;height:60px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(0,0,0,.3),0 0 0 3px rgba(224,174,79,.35)}
.fab:hover{background:var(--accent-dark)}
@media (min-width:761px){.fab{display:none}}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}

/* Fenêtres */
.dialog{width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dialog::backdrop{background:rgba(25,17,11,.6)}
.dialog__form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dialog__head{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.dialog__title{font-size:20px;flex:1}
.dialog__body{padding:4px 20px 14px;overflow-y:auto;display:grid;gap:14px}
.dialog__foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line)}
.dialog__spacer{flex:1}
.dialog--small{width:min(480px,calc(100vw - 24px))}
.field{display:grid;gap:6px;min-width:0}
.field__label{font:600 13.5px/1.2 var(--font-title);color:var(--ink-strong)}
.field__opt{font:400 12.5px var(--font-text);color:var(--muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--field);color:var(--ink-strong);font-size:16px}
textarea.input{resize:vertical;min-height:64px;line-height:1.4}
.input:focus{outline:none;border-color:var(--amber-line);box-shadow:0 0 0 3px rgba(224,174,79,.3)}
.input[aria-invalid="true"]{border-color:var(--wine);box-shadow:0 0 0 3px rgba(142,43,43,.2)}
.msg{margin:0;padding:8px 12px;border-radius:var(--radius-sm);font-size:13.5px}
.msg--error{background:var(--wine-soft);color:var(--wine-text);font-weight:600}
.msg--warn{background:var(--amber-soft);color:var(--amber-text)}
.msgs{display:grid;gap:6px}.msgs:empty{display:none}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;align-items:center;gap:10px;padding:4px 0}
.steps label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:14px}
.steps .done span{color:var(--muted);text-decoration:line-through}
.steps .x{width:30px;height:30px}
.step-add{display:flex;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 110px);padding:11px 12px 11px 18px;border-radius:12px;background:var(--wood);color:var(--cream);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;border:1px solid rgba(224,174,79,.35)}
.toast button{border:0;background:none;color:var(--toast-action);font:700 13.5px/1 var(--font-title);padding:6px 8px;border-radius:6px}
.errbox{padding:12px 14px;border-radius:var(--radius-sm);background:var(--wine-soft);color:var(--wine-text);margin-bottom:14px}

@media (max-width:760px){
  .topbar__add{display:none}
  .brand__sub{display:none}
  .sync__label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tab{flex:1;padding-left:8px;padding-right:8px}
  .toolbar{flex-direction:column;align-items:stretch;gap:8px}

<script>
"use strict";
/* ============================================================
   Studio podcast — suivi des tâches (outil simple, fichier unique)
   Données : localStorage + export / import JSON.
   ============================================================ */
const APP_VERSION='2.1.0', SCHEMA='studio-taches', SCHEMA_VERSION='1.0.0';
const KEY='studioTaches.v1', PREV=KEY+'.prev', UIKEY='studioTaches.ui.v1', CODEKEY=KEY+'.code';
const STATUS={'a-faire':'À faire','en-cours':'En cours','a-valider':'À valider','bloque':'Bloquée','termine':'Terminée'};
const CH={P:'Pilotage',A:'Marketing & digital',B:'Business & commercial'};
const VIEWS=['todo','chantiers','calendrier'];

/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(pd(s))===s;
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const WD=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt=s=>isDate(s)?WD[pd(s).getDay()]+' '+pd(s).getDate()+' '+MON[pd(s).getMonth()]:'Sans date';
const fmtS=s=>isDate(s)?pd(s).getDate()+' '+MON[pd(s).getMonth()]:'';
const fmtFR=s=>isDate(s)?p2(pd(s).getDate())+'/'+p2(pd(s).getMonth()+1)+'/'+pd(s).getFullYear():'—';
const nowIso=()=>new Date().toISOString();
const ts=v=>{const n=Date.parse(String(v||''));return isNaN(n)?0:n};
function today(){try{const q=new URLSearchParams(location.search).get('today');if(q&&isDate(q))return q}catch(e){}return iso(new Date())}
const mondayOf=s=>{const d=pd(s);return addD(s,-((d.getDay()+6)%7))};
const initial=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();

/* ---------- Données ---------- */
let state=null,storageOK=true,loadNote='',firstRun=false;
const SYNC={on:false,exists:false,probe:false,busy:false,dirty:false,status:'off',code:'',timer:null,last:0,stale:false};
const API='/api/sync';
const POLL=(()=>{try{const q=Number(new URLSearchParams(location.search).get('syncpoll'));if(q>=300)return q}catch(e){}return 30000})();
const ui={view:'todo',person:'',groups:{},calMonth:'',calDay:'',draft:null,lastSnap:null};
const isDone=t=>t.status==='termine';

function validate(o){
  const e=[];
  if(!o||typeof o!=='object'||Array.isArray(o))return ['Le fichier ne contient pas un objet JSON.'];
  if(o.schema!==SCHEMA)e.push('Ce fichier n’est pas une sauvegarde de cet outil (schéma « '+SCHEMA+' » attendu).');
  if(typeof o.schemaVersion!=='string'||o.schemaVersion.split('.')[0]!=='1')e.push('Version de schéma non prise en charge : '+o.schemaVersion+'.');
  if(!Array.isArray(o.tasks))e.push('« tasks » doit être un tableau.');
  if(!o.project||typeof o.project!=='object')e.push('« project » manquant.');
  if(e.length)return e;
  const ids=new Set();
  o.tasks.forEach((t,i)=>{
    if(!t||typeof t!=='object'){e.push('tasks['+i+'] invalide.');return}
    const w=t.id||('tasks['+i+']');
    if(typeof t.id!=='string'||!t.id)e.push(w+' : identifiant manquant.');else if(ids.has(t.id))e.push('Identifiant en doublon : '+t.id+'.');ids.add(t.id);
    if(typeof t.title!=='string'||!t.title.trim())e.push(w+' : titre manquant.');
    if(!CH[t.chantier])e.push(w+' : chantier invalide.');
    if(!STATUS[t.status])e.push(w+' : statut invalide « '+t.status+' ».');
    if(t.due&&!isDate(t.due))e.push(w+' : échéance invalide.');
    if(t.subtasks!==undefined&&!Array.isArray(t.subtasks))e.push(w+' : subtasks doit être un tableau.');
    if(t.dependencies!==undefined&&!Array.isArray(t.dependencies))e.push(w+' : dependencies doit être un tableau.');
  });
  return e;
}
function normalize(o){
  o.people=Array.isArray(o.people)?o.people.filter(x=>typeof x==='string'&&x.trim()):[];
  o.meta=(o.meta&&typeof o.meta==='object')?o.meta:{};
  const dl={};if(o.deleted&&typeof o.deleted==='object'&&!Array.isArray(o.deleted))Object.entries(o.deleted).forEach(([k,v])=>{if(typeof v==='string'&&Date.parse(v))dl[k]=v});o.deleted=dl;
  o.project.milestones=Array.isArray(o.project.milestones)?o.project.milestones:[];
  o.tasks.forEach(t=>{
    t.owner=String(t.owner||'');t.due=t.due||'';t.deliverable=String(t.deliverable||'');t.nextAction=String(t.nextAction||'');
    t.dependencies=Array.isArray(t.dependencies)?t.dependencies:[];
    t.subtasks=(Array.isArray(t.subtasks)?t.subtasks:[]).filter(s=>s&&typeof s.t==='string').map(s=>({t:s.t,done:!!s.done}));
    t.validatedAt=t.validatedAt||null;t.updatedAt=t.updatedAt||nowIso();
  });
  return o;
}
function loadState(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOK=false}
  if(raw){
    try{const o=JSON.parse(raw),errs=validate(o);
      if(!errs.length)return normalize(o);
      loadNote='Les données enregistrées dans ce navigateur étaient invalides ; une copie est gardée sous « '+KEY+'.corrupt ». L’outil est reparti du modèle.';
    }catch(e){loadNote='Les données enregistrées dans ce navigateur étaient illisibles ; une copie est gardée sous « '+KEY+'.corrupt ».'}
    try{localStorage.setItem(KEY+'.corrupt',raw)}catch(e){}
  }
  firstRun=true;
  return normalize(JSON.parse($('#initial-state').textContent));
}
function persist(localOnly){
  state.meta.updatedAt=nowIso();
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}
  renderSync();
  if(!localOnly&&SYNC.on)schedulePush(1200);
}
function saveUi(){try{localStorage.setItem(UIKEY,JSON.stringify({view:ui.view,person:ui.person}))}catch(e){}}
function loadUi(){try{const u=JSON.parse(localStorage.getItem(UIKEY)||'{}');if(u&&typeof u==='object'){ui.person=typeof u.person==='string'?u.person:''}}catch(e){}}
function snapshotPrev(){try{localStorage.setItem(PREV,JSON.stringify({at:nowIso(),state}));return true}catch(e){return false}}
const byId=id=>state.tasks.find(t=>t.id===id);
const touch=t=>{t.updatedAt=nowIso();return t};
function uniqNames(list){const s=[];list.forEach(n=>{n=String(n||'').trim();if(n&&!s.some(x=>same(x,n)))s.push(n)});return s}
function people(){return uniqNames(state.people.concat(state.tasks.map(t=>t.owner)))}
function activeOwners(){const o=uniqNames(state.tasks.map(t=>t.owner));return ui.person&&!o.some(x=>same(x,ui.person))?o.concat([ui.person]):o}


/* ---------- Calculs ---------- */
function visibleTasks(){return state.tasks.filter(t=>!ui.person||same(t.owner,ui.person))}
function dueState(t){
  if(isDone(t)||!t.due)return 'none';
  const d=diffD(today(),t.due);
  return d<0?'late':d<=3?'soon':'later';
}
const sortT=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||state.tasks.indexOf(a)-state.tasks.indexOf(b);
function counts(list){
  const open=list.filter(t=>!isDone(t));
  return {late:open.filter(t=>dueState(t)==='late').length,soon:open.filter(t=>dueState(t)==='soon').length,val:open.filter(t=>t.status==='a-valider').length,open:open.length,done:list.length-open.length,tot:list.length};
}

/* ---------- Rendu : composants ---------- */
function relBadge(t){
  if(isDone(t))return t.validatedAt?'<span class="badge badge--quiet">Terminée le '+esc(fmtFR(String(t.validatedAt).slice(0,10)))+'</span>':'';
  if(!t.due)return '<span class="badge badge--quiet">Sans date</span>';
  const d=diffD(today(),t.due);
  if(d<0)return '<span class="badge badge--late">En retard · '+(-d)+' jour'+(-d>1?'s':'')+'</span>';
  if(d===0)return '<span class="badge badge--soon">Aujourd’hui</span>';
  if(d===1)return '<span class="badge badge--soon">Demain</span>';
  if(d<=3)return '<span class="badge badge--soon">Dans '+d+' jours</span>';
  return '<span class="task__rel">J-'+d+'</span>';
}
function statusBadge(t){
  return t.status==='en-cours'?'<span class="badge badge--prog">En cours</span>':t.status==='a-valider'?'<span class="badge badge--val">À valider</span>':t.status==='bloque'?'<span class="badge badge--block">Bloquée</span>':'';
}
function taskRow(t,opt){
  opt=opt||{};
  const ds=dueState(t),done=isDone(t);
  const sub=t.subtasks.length?'<span>'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+' étapes</span>':'';
  const we=!done&&t.due&&[0,6].includes(pd(t.due).getDay())?'<span class="badge badge--quiet">week-end</span>':'';
  const note=!done&&t.nextAction?'<p class="task__note">'+esc(t.nextAction)+'</p>':'';
  return '<li class="task'+(ds==='late'?' is-late':ds==='soon'?' is-soon':'')+(done?' is-done':'')+'" data-id="'+esc(t.id)+'">'+
   '<label class="task__check"><input type="checkbox" class="checkbox" data-toggle="'+esc(t.id)+'"'+(done?' checked':'')+' aria-label="Terminée : '+esc(t.title)+'"></label>'+
   '<div class="task__body" role="button" tabindex="0" data-act="open" data-id="'+esc(t.id)+'">'+
     '<div class="task__title">'+esc(t.title)+'</div>'+
     '<div class="task__meta"><span class="task__id"><i class="dot dot--'+esc(t.chantier)+'"></i>'+esc(t.id)+'</span>'+(opt.noDate?'':'<span>'+esc(fmt(t.due))+'</span>')+relBadge(t)+statusBadge(t)+we+sub+(opt.showCh?'<span>'+esc(CH[t.chantier])+'</span>':'')+'</div>'+note+
   '</div>'+
   '<span class="avatar" title="'+esc(t.owner||'Sans responsable')+'">'+esc(initial(t.owner))+'</span></li>';
}
const CHEV='<svg class="group__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function group(id,title,cls,list,opt){
  const isOpen=ui.groups[id]!==undefined?ui.groups[id]:!(opt&&opt.closed);
  return '<details class="card group '+cls+'" id="g-'+id+'" data-gid="'+id+'"'+(isOpen?' open':'')+'><summary class="group__title">'+esc(title)+' <span class="group__count">'+list.length+'</span>'+(opt&&opt.prog||'')+CHEV+'</summary><ul class="task-list">'+list.map(t=>taskRow(t,opt)).join('')+'</ul></details>';
}

/* ---------- Rendu : vues ---------- */
function vTodo(){
  const list=visibleTasks(),open=list.filter(t=>!isDone(t)).sort(sortT),done=list.filter(isDone).sort((a,b)=>String(b.validatedAt||'').localeCompare(String(a.validatedAt||'')));
  const late=open.filter(t=>dueState(t)==='late'),soon=open.filter(t=>dueState(t)==='soon');
  const later=open.filter(t=>dueState(t)==='later'),nodate=open.filter(t=>dueState(t)==='none');
  const weeks=new Map();later.forEach(t=>{const w=mondayOf(t.due);if(!weeks.has(w))weeks.set(w,[]);weeks.get(w).push(t)});
  let h='<div class="view-head"><div><h2 class="view-title">À faire</h2><p class="view-sub">'+(ui.person?'Tâches de '+esc(ui.person):'Toutes les tâches de l’équipe')+' · '+open.length+' restante'+(open.length>1?'s':'')+(done.length?' · '+done.length+' terminée'+(done.length>1?'s':''):'')+'</p></div></div><div class="groups">';
  if(late.length)h+=group('late','En retard','group--late',late);
  if(soon.length)h+=group('soon','Dans les 3 prochains jours','group--soon',soon);
  [...weeks.keys()].sort().forEach(w=>{const wk=addD(w,6);h+=group('w'+w,'Semaine du '+fmtS(w)+' au '+fmtS(wk),'',weeks.get(w))});
  if(nodate.length)h+=group('nodate','Sans date','',nodate);
  if(!open.length)h+='<div class="card empty">'+(ui.person?'Aucune tâche à faire pour '+esc(ui.person)+'.':'Rien à faire pour le moment.')+'</div>';
  if(done.length)h+=group('done','Terminées','',done,{closed:true});
  return h+'</div>';
}
function vChantiers(){
  const all=visibleTasks(),c=counts(all);
  let h='<div class="view-head"><div><h2 class="view-title">Par chantier</h2><p class="view-sub">'+(ui.person?'Tâches de '+esc(ui.person):'Toutes les tâches')+'</p></div></div>'+
   '<div class="card sum"><div><b>'+c.done+'</b> / '+c.tot+' terminées</div><div class="progress" role="img" aria-label="'+c.done+' sur '+c.tot+' terminées"><i style="width:'+(c.tot?Math.round(100*c.done/c.tot):0)+'%"></i></div><div class="view-sub" style="margin:0">'+(c.val?c.val+' à valider · ':'')+c.late+' en retard</div></div><div class="groups">';
  Object.keys(CH).forEach(k=>{
    const l=all.filter(t=>t.chantier===k).sort(sortT);if(!l.length)return;
    const d=l.filter(isDone).length;
    h+=group('c'+k,CH[k],'',l,{showCh:false,prog:'<span class="group__prog"><span>'+d+'/'+l.length+'</span><span class="progress"><i style="width:'+Math.round(100*d/l.length)+'%"></i></span></span>'});
  });
  return h+'</div>';
}
function vCalendrier(){
  const t0=today(),p=state.project;
  if(!ui.calMonth)ui.calMonth=(t0>=p.start&&t0<=p.deadline?t0:p.start||t0).slice(0,7);
  const [y,m]=ui.calMonth.split('-').map(Number),first=iso(new Date(y,m-1,1));
  const start=mondayOf(first),list=visibleTasks();
  const byDay={};list.forEach(t=>{if(t.due){(byDay[t.due]=byDay[t.due]||[]).push(t)}});
  const ms={};(state.project.milestones||[]).forEach(x=>{if(isDate(x.date))(ms[x.date]=ms[x.date]||[]).push(x)});
  if(!ui.calDay||ui.calDay.slice(0,7)!==ui.calMonth)ui.calDay=(t0.slice(0,7)===ui.calMonth?t0:first);
  let cells='';
  ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'].forEach(w=>cells+='<div class="cal__wd">'+w+'</div>');
  for(let i=0;i<42;i++){
    const d=addD(start,i),dt=pd(d),inM=d.slice(0,7)===ui.calMonth,ts=(byDay[d]||[]).sort(sortT);
    if(i>=35&&!inM&&dt.getDay()===1)break;
    cells+='<div class="day'+(inM?'':' is-out')+([0,6].includes(dt.getDay())?' is-we':'')+(d===t0?' is-today':'')+(d===ui.calDay?' is-sel':'')+'" data-act="day" data-date="'+d+'"><div class="day__top"><span class="day__num">'+dt.getDate()+'</span>'+(ms[d]?'<span class="day__flag" title="'+esc(ms[d].map(x=>x.id+' '+x.label).join(' · '))+'">⚑ '+esc(ms[d].map(x=>x.id).join(' '))+'</span>':'')+'</div>'+
      ts.slice(0,3).map(t=>'<span class="chip chip--'+esc(t.chantier)+(isDone(t)?' chip--done':'')+'" data-act="open" data-id="'+esc(t.id)+'" title="'+esc(t.id+' · '+t.title)+'">'+esc(t.id)+'<span class="chip__t"> '+esc(t.title)+'</span></span>').join('')+(ts.length>3?'<span class="day__more">+'+(ts.length-3)+'</span>':'')+'</div>';
  }
  const sel=(byDay[ui.calDay]||[]).sort(sortT),sm=ms[ui.calDay]||[];
  return '<div class="cal-head"><div class="cal-nav-row"><button type="button" class="icon-btn" data-act="cal-prev" aria-label="Mois précédent"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h2 class="cal-title">'+MONL[m-1]+' '+y+'</h2><button type="button" class="icon-btn" data-act="cal-next" aria-label="Mois suivant"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button type="button" class="btn btn--ghost btn--small" data-act="cal-today">Aujourd’hui</button></div>'+
    '<div class="cal-legend"><span><i class="dot dot--P"></i>Pilotage</span><span><i class="dot dot--A"></i>Marketing</span><span><i class="dot dot--B"></i>Business</span></div></div>'+
    '<div class="cal">'+cells+'</div>'+
    '<div class="card day-panel" id="day-panel"><h3>'+esc(fmt(ui.calDay))+' '+pd(ui.calDay).getFullYear()+'</h3>'+sm.map(x=>'<div class="ms">⚑ Jalon '+esc(x.id)+' · '+esc(x.label)+'</div>').join('')+(sel.length?'<ul class="task-list">'+sel.map(t=>taskRow(t,{noDate:true,showCh:true})).join('')+'</ul>':'<div class="empty">Aucune tâche à cette date.</div>')+'</div>';
}

function renderSync(){
  const el=$('#sync'),lb=$('#sync-label');if(!el)return;
  const st=SYNC.status;

function renderFooter(){

function showFatal(err){
  const m=$('#main');if(!m)return;
  m.innerHTML='<div class="errbox" role="alert"><b>Erreur d’affichage.</b> Tes données ne sont pas perdues.<br><code>'+esc(err&&err.message||err)+'</code><pre style="white-space:pre-wrap;font-size:11px;max-height:180px;overflow:auto">'+esc(err&&err.stack||'')+'</pre><button type="button" class="btn btn--ghost" data-act="backup">Ouvrir la sauvegarde</button></div>';

    $('#main').innerHTML=(loadNote?'<div class="errbox">'+esc(loadNote)+'</div>':'')+(!storageOK?'<div class="errbox"><b>Stockage local indisponible</b> (navigation privée ou fichier bloqué) : les modifications ne seront pas conservées. Exporte régulièrement ton JSON.</div>':'')+

/* ---------- Actions sur les tâches ---------- */
function toast(msg,action,fn){
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button type="button">'+esc(action)+'</button>':'');
  if(action)t.querySelector('button').addEventListener('click',()=>{fn();t.remove()});
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),action?7000:3500);
}
function setStatus(t,s){
  t.status=s;
  if(s==='termine'){t.validatedAt=nowIso()}else{t.validatedAt=null}
  touch(t);
}
function toggleTask(id,checked){
  const t=byId(id);if(!t)return;
  const before={status:t.status,validatedAt:t.validatedAt,updatedAt:t.updatedAt};
  setStatus(t,checked?'termine':'a-faire');persist();render();
  toast(checked?'Tâche terminée : '+t.id:'Tâche rouverte : '+t.id,'Annuler',()=>{Object.assign(t,before);touch(t);persist();render()});
}
function nextId(){
  const used=new Set(state.tasks.map(t=>t.id).concat(Object.keys(state.deleted||{})));
  if(SYNC.on){let id;do{id='N'+Math.random().toString(36).slice(2,5).toUpperCase()}while(used.has(id));return id}
  let n=1;while(used.has('N'+p2(n)))n++;return 'N'+p2(n)}
function openTask(id){
  const t=id?byId(id):null,f=$('#task-form');
  ui.draft={id:t?t.id:null,subtasks:t?t.subtasks.map(s=>({...s})):[]};
  $('#task-title-h').textContent=t?t.id+' · Modifier la tâche':'Nouvelle tâche';
  f.chantier.innerHTML=Object.entries(CH).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join('');
  f.status.innerHTML=Object.entries(STATUS).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join('');
  f.title.value=t?t.title:'';f.chantier.value=t?t.chantier:'A';f.owner.value=t?t.owner:(ui.person||'');
  f.due.value=t?t.due:'';f.status.value=t?t.status:'a-faire';f.deliverable.value=t?t.deliverable:'';f.nextAction.value=t?t.nextAction:'';
  $('#step-new').value='';$('#form-msgs').innerHTML='';
  $$('[aria-invalid]',f).forEach(x=>x.removeAttribute('aria-invalid'));
  $('#btn-del').hidden=!t;
  const deps=t?t.dependencies.map(d=>{const x=byId(d);return x?esc(d)+' ('+esc(STATUS[x.status].toLowerCase())+')':null}).filter(Boolean):[];
  $('#deps-hint').innerHTML=deps.length?'À faire après : '+deps.join(' · '):'';
  renderSteps();
  $('#task-dialog').showModal();
  if(!t)f.title.focus();
}
function renderSteps(){
  $('#steps').innerHTML=ui.draft.subtasks.map((s,i)=>'<li class="'+(s.done?'done':'')+'"><label><input type="checkbox" class="checkbox" data-step="'+i+'"'+(s.done?' checked':'')+'><span>'+esc(s.t)+'</span></label><button type="button" class="icon-btn x" data-act="step-del" data-i="'+i+'" aria-label="Retirer l’étape"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></li>').join('');
}
function addStep(){const i=$('#step-new'),v=i.value.trim();if(!v)return;ui.draft.subtasks.push({t:v,done:false});i.value='';renderSteps();i.focus()}
function submitTask(e){
  e.preventDefault();
  const f=$('#task-form'),msgs=[];
  $$('[aria-invalid]',f).forEach(x=>x.removeAttribute('aria-invalid'));
  const title=f.title.value.trim();
  if(!title){msgs.push('Donne un titre à la tâche.');f.title.setAttribute('aria-invalid','true')}
  if(f.due.value&&!isDate(f.due.value)){msgs.push('Date d’échéance invalide.');f.due.setAttribute('aria-invalid','true')}
  if(msgs.length){$('#form-msgs').innerHTML=msgs.map(m=>'<p class="msg msg--error">'+esc(m)+'</p>').join('');return}
  const pending=$('#step-new').value.trim();if(pending)ui.draft.subtasks.push({t:pending,done:false});
  let t=ui.draft.id?byId(ui.draft.id):null;
  if(!t){t={id:nextId(),chantier:'A',title:'',owner:'',status:'a-faire',due:'',deliverable:'',nextAction:'',dependencies:[],subtasks:[],validatedAt:null};state.tasks.push(t)}
  const wasDone=isDone(t);
  Object.assign(t,{title,chantier:f.chantier.value,owner:f.owner.value.trim(),due:f.due.value,deliverable:f.deliverable.value.trim(),nextAction:f.nextAction.value.trim(),subtasks:ui.draft.subtasks});
  if(f.status.value!==t.status||(!wasDone&&f.status.value==='termine')){setStatus(t,f.status.value)}
  touch(t);persist();$('#task-dialog').close();render();toast('Tâche enregistrée : '+t.id);
}
async function deleteTask(){
  const t=ui.draft&&ui.draft.id?byId(ui.draft.id):null;if(!t)return;
  const dependents=state.tasks.filter(x=>x.dependencies.includes(t.id)).map(x=>x.id);
  const r=await choice('Supprimer cette tâche ?','<p><b>'+esc(t.id)+' · '+esc(t.title)+'</b></p><p class="hint">Cette action est définitive'+(dependents.length?'. Les tâches '+esc(dependents.join(', '))+' ne dépendront plus d’elle':'')+'. Pense à exporter un JSON avant si besoin.</p>',[{v:'no',l:'Annuler',cls:'btn--ghost'},{v:'yes',l:'Supprimer',cls:'btn--danger'}]);
  if(r!=='yes')return;
  state.tasks=state.tasks.filter(x=>x.id!==t.id);state.deleted[t.id]=nowIso();state.tasks.forEach(x=>{if(x.dependencies.includes(t.id)){x.dependencies=x.dependencies.filter(d=>d!==t.id);touch(x)}});
  persist();$('#task-dialog').close();render();toast('Tâche supprimée : '+t.id);
}

/* ---------- Sauvegarde / import / export ---------- */
function stamp(){const d=new Date();return iso(d)+'_'+p2(d.getHours())+p2(d.getMinutes())}
function exportObj(){return Object.assign({},state,{exportedAt:nowIso(),appVersion:APP_VERSION})}
function download(name,text){const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function exportJSON(){
  state.meta.lastExportAt=nowIso();persist();
  download('STUDIO_Taches_'+stamp()+'.json',JSON.stringify(exportObj(),null,2));
  toast('Export JSON téléchargé. Range-le hors du navigateur (cloud, clé USB).');render();if($('#backup-dialog').open)openBackup();
}
async function copyJSON(){
  const txt=JSON.stringify(exportObj(),null,2);
  try{await navigator.clipboard.writeText(txt);state.meta.lastExportAt=nowIso();persist();toast('JSON copié dans le presse-papiers. Colle-le dans un fichier .json.');render();return}catch(e){}
  const ta=$('#json-box');if(ta){ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast('Copie automatique impossible : sélectionne et copie le texte.')}
}
function openBackup(){
  const le=state.meta.lastExportAt;let prev=null;try{prev=JSON.parse(localStorage.getItem(PREV)||'null')}catch(e){}
  $('#backup-body').innerHTML=
   '<p class="hint">Tes tâches sont enregistrées <b>dans ce navigateur seulement</b> : ce n’est ni un cloud, ni une synchronisation entre appareils. Exporte régulièrement un fichier JSON et range-le ailleurs.</p>'+
   '<p>'+(le?'Dernier export : <b>'+esc(fmtFR(String(le).slice(0,10)))+'</b>':'<b>Aucun export pour l’instant.</b>')+'</p>'+
   '<div class="btnrow"><button type="button" class="btn btn--accent" data-act="export">Exporter le JSON</button><button type="button" class="btn btn--ghost" data-act="copy">Copier le JSON</button><button type="button" class="btn btn--ghost" data-act="import">Importer un fichier…</button></div>'+
   '<textarea class="input" id="json-box" rows="6" hidden readonly aria-label="Contenu JSON"></textarea>'+
   '<details><summary class="field__label" style="cursor:pointer">Coller un JSON à importer</summary><div class="field" style="margin-top:8px"><textarea class="input" id="json-paste" rows="5" placeholder="Colle ici le contenu d’un fichier .json"></textarea><div class="btnrow"><button type="button" class="btn btn--ghost btn--small" data-act="import-text">Importer ce texte</button></div></div></details>'+
   '<div id="import-msgs" class="msgs"></div>'+
   (SYNC.on?'<p class="hint"><b>Synchronisation d’équipe active</b> : les tâches sont partagées avec les personnes qui ont le code.'+(SYNC.last?' Dernière synchro à '+esc(new Date(SYNC.last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}))+'.':'')+' <button type="button" class="link" data-act="sync-off">Désactiver sur cet appareil</button></p>':'')+
   '<hr style="border:0;border-top:1px solid var(--line);width:100%;margin:2px 0">'+
   (prev&&prev.state?'<div class="btnrow"><button type="button" class="btn btn--ghost btn--small" data-act="restore-prev">Restaurer la version d’avant le dernier import / la dernière réinitialisation ('+esc(fmtFR(String(prev.at).slice(0,10)))+')</button></div>':'')+
   '<div class="btnrow"><button type="button" class="btn btn--danger btn--small" data-act="reset">Réinitialiser (repartir du modèle)</button></div>';
  if(!$('#backup-dialog').open)$('#backup-dialog').showModal();
}
function mergeImport(o){
  let add=0,upd=0,keep=0;
  o.tasks.forEach(n=>{const i=state.tasks.findIndex(t=>t.id===n.id);
    if(i<0){if(ts(state.deleted[n.id])>=ts(n.updatedAt)&&state.deleted[n.id]){keep++;return}delete state.deleted[n.id];state.tasks.push(n);add++}
    else if(ts(n.updatedAt)>ts(state.tasks[i].updatedAt)){state.tasks[i]=n;upd++}else keep++});
  (o.people||[]).forEach(p=>{if(!state.people.some(x=>same(x,p)))state.people.push(p)});
  return {add,upd,keep};
}
async function handleImport(text){
  const box=$('#import-msgs');if(box)box.innerHTML='';
  let o;
  try{o=JSON.parse(text)}catch(e){if(box)box.innerHTML='<p class="msg msg--error">Fichier illisible : ce n’est pas un JSON valide. Rien n’a été modifié.</p>';return}
  const errs=validate(o);
  if(errs.length){if(box)box.innerHTML='<div class="msg msg--error"><b>Import refusé, aucune donnée modifiée.</b><ul style="margin:6px 0 0;padding-left:18px">'+errs.slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')+(errs.length>8?'<li>… et '+(errs.length-8)+' autres</li>':'')+'</ul></div>';return}
  normalize(o);
  const r=await choice('Importer ce fichier',
    '<p>'+o.tasks.length+' tâche(s) dans le fichier'+(o.exportedAt?' (exporté le '+esc(fmtFR(String(o.exportedAt).slice(0,10)))+')':'')+'. Tu en as '+state.tasks.length+' ici.</p><p class="hint"><b>Fusionner</b> : ajoute les tâches nouvelles, met à jour celles modifiées plus récemment dans le fichier, ne supprime rien.<br><b>Remplacer</b> : le fichier remplace tout'+(SYNC.on?', <b>y compris pour toute l’équipe</b>':'')+'. Une copie de l’état actuel est gardée avant.</p>',
    [{v:'no',l:'Annuler',cls:'btn--ghost'},{v:'replace',l:'Remplacer tout',cls:'btn--danger'},{v:'merge',l:'Fusionner',cls:'btn--accent'}]);
  if(r!=='merge'&&r!=='replace')return;
  snapshotPrev();
  if(r==='replace'){const prev=state.tasks;state=o;claimAll(prev);toast('Import terminé : '+o.tasks.length+' tâche(s).')}
  else{const s=mergeImport(o);toast('Fusion : '+s.add+' ajoutée(s), '+s.upd+' mise(s) à jour, '+s.keep+' conservée(s).')}
  persist();render();openBackup();
}
async function resetAll(){
  const r=await choice('Réinitialiser ?','<p>'+(SYNC.on?'<b>Attention : la synchronisation est active, cela remplacera aussi les tâches de toute l’équipe.</b> ':'')+'Toutes tes modifications seront remplacées par le modèle de départ. Une copie de l’état actuel est gardée dans le navigateur (restaurable), mais <b>exporte un JSON avant</b> si tu y tiens.</p>',[{v:'no',l:'Annuler',cls:'btn--ghost'},{v:'yes',l:'Réinitialiser',cls:'btn--danger'}]);
  if(r!=='yes')return;
  snapshotPrev();{const prev=state.tasks;state=normalize(JSON.parse($('#initial-state').textContent));claimAll(prev)}ui.person='';saveUi();persist();render();openBackup();toast('Réinitialisé depuis le modèle.');
}
function restorePrev(){
  try{const p=JSON.parse(localStorage.getItem(PREV)||'null');
    if(!p||validate(p.state).length)throw new Error('copie invalide');
    const cur=state;state=normalize(p.state);claimAll(cur.tasks);try{localStorage.setItem(PREV,JSON.stringify({at:nowIso(),state:cur}))}catch(e){}
    persist();render();openBackup();toast('Version précédente restaurée.');
  }catch(e){toast('Restauration impossible : '+e.message)}
}

/* ---------- Synchronisation d’équipe (facultative : demande le service /api/sync) ---------- */
function claimAll(prevTasks){
  const now=nowIso(),ids=new Set(state.tasks.map(t=>t.id));
  prevTasks.forEach(t=>{if(!ids.has(t.id))state.deleted[t.id]=now});
  state.tasks.forEach(t=>{t.updatedAt=now;delete state.deleted[t.id]});
}
function mergeStates(L,R){
  const del=Object.assign({},L.deleted||{});
  Object.entries(R.deleted||{}).forEach(([id,t])=>{if(ts(t)>ts(del[id]))del[id]=t});
  const map=new Map();
  (L.tasks||[]).forEach(t=>map.set(t.id,t));
  (R.tasks||[]).forEach(t=>{const c=map.get(t.id);if(!c||ts(t.updatedAt)>ts(c.updatedAt))map.set(t.id,t)});
  const tasks=[];map.forEach((t,id)=>{if(del[id]&&ts(del[id])>=ts(t.updatedAt))return;tasks.push(t)});
  const people=uniqNames((L.people||[]).concat(R.people||[]));
  return {tasks,deleted:del,people};
}
function setSync(st){SYNC.status=st;renderSync()}
function schedulePush(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,ms)}
function applyRemote(d){
  if(!d||!Array.isArray(d.tasks))throw new Error('réponse invalide');
  const m=mergeStates({tasks:state.tasks,deleted:state.deleted,people:state.people},{tasks:d.tasks,deleted:d.deleted||{},people:d.people||[]});
  if(validate({schema:SCHEMA,schemaVersion:SCHEMA_VERSION,project:state.project,tasks:m.tasks}).length)throw new Error('données distantes invalides');
  const before=JSON.stringify([state.tasks,state.deleted]);
  state.tasks=m.tasks;state.deleted=m.deleted;state.people=m.people;normalize(state);
  if(JSON.stringify([state.tasks,state.deleted])!==before){
    persist(true);
    if(document.querySelector('dialog[open]'))SYNC.stale=true;else render();
  }
}
async function syncNow(){
  if(!SYNC.on&&!SYNC.probe)return;
  if(SYNC.busy){SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.dirty=false;
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-studio-code':SYNC.code},cache:'no-store',
      body:JSON.stringify({tasks:state.tasks,deleted:state.deleted,people:state.people})});
    if(r.status===401){
      const hadCode=!!SYNC.code;SYNC.exists=true;SYNC.on=false;SYNC.probe=false;SYNC.code='';
      try{localStorage.removeItem(CODEKEY)}catch(e){}
      setSync('auth');askCode(hadCode?'Code incorrect. Réessaie.':'');return;
    }
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    SYNC.probe=false;SYNC.exists=true;SYNC.on=true;
    applyRemote(d);SYNC.last=Date.now();setSync('ok');
  }catch(e){
    if(SYNC.probe){SYNC.probe=false;SYNC.on=false;setSync('off')}else setSync('offline');
  }finally{SYNC.busy=false;if(SYNC.dirty&&SYNC.on)schedulePush(300)}
}
function askCode(msg){
  const d=$('#code-dialog');$('#code-msgs').innerHTML=msg?'<p class="msg msg--error">'+esc(msg)+'</p>':'';
  $('#code-form').code.value='';if(!d.open)d.showModal();
}
function submitCode(e){
  e.preventDefault();
  const v=$('#code-form').code.value.trim();if(!v){$('#code-msgs').innerHTML='<p class="msg msg--error">Saisis le code.</p>';return}
  SYNC.code=v;try{localStorage.setItem(CODEKEY,v)}catch(x){}
  $('#code-dialog').close();SYNC.probe=true;syncNow();
}
function syncOff(){
  SYNC.on=false;SYNC.probe=false;SYNC.code='';try{localStorage.removeItem(CODEKEY)}catch(e){}
  setSync('off');openBackup();toast('Synchronisation désactivée sur cet appareil.');
}
function initSync(){
  if(!/^https?:$/.test(location.protocol))return;
  try{SYNC.code=localStorage.getItem(CODEKEY)||''}catch(e){}
  SYNC.probe=true;syncNow(); // sonde : si le service existe et exige un code, on le demande
  setInterval(()=>{if(SYNC.on&&!document.hidden)syncNow()},POLL);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SYNC.on)syncNow()});
  window.addEventListener('online',()=>{if(SYNC.exists&&SYNC.code){SYNC.on=true;syncNow()}});
  document.addEventListener('close',()=>{if(SYNC.stale&&!document.querySelector('dialog[open]')){SYNC.stale=false;render()}},true);
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const ch=e.target.closest('[data-choice]');if(ch){endChoice(ch.dataset.choice);return}
  const tab=e.target.closest('.tab');if(tab){location.hash='#/'+tab.dataset.view;return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'new':openTask(null);break;
    case 'open':e.stopPropagation();openTask(id);break;
    case 'close':{const d=el.closest('dialog');if(d)d.close();break}
    case 'step-add':addStep();break;
    case 'step-del':ui.draft.subtasks.splice(Number(el.dataset.i),1);renderSteps();break;
    case 'delete':deleteTask();break;
    case 'who':ui.person=el.dataset.v;saveUi();ui.calDay='';render();break;
    case 'jump':{const g=document.getElementById(el.dataset.v);if(g){g.open=true;ui.groups[g.dataset.gid]=true;g.scrollIntoView({behavior:'smooth',block:'start'})}break}
    case 'valider':{ui.person=ui.person;location.hash='#/todo';const t=visibleTasks().find(x=>x.status==='a-valider');if(t)openTask(t.id);break}
    case 'backup':openBackup();break;
    case 'sync-code':askCode('');break;
    case 'sync-off':syncOff();break;
    case 'export':exportJSON();break;
    case 'copy':copyJSON();break;
    case 'import':$('#file-in').click();break;
    case 'import-text':handleImport(($('#json-paste')||{}).value||'');break;
    case 'reset':resetAll();break;
    case 'restore-prev':restorePrev();break;
    case 'cal-prev':case 'cal-next':{const [y,m]=ui.calMonth.split('-').map(Number),d=new Date(y,m-1+(a==='cal-next'?1:-1),1);ui.calMonth=iso(d).slice(0,7);ui.calDay='';render();break}
    case 'cal-today':ui.calMonth=today().slice(0,7);ui.calDay=today();render();break;
    case 'day':ui.calDay=el.dataset.date;if(ui.calDay.slice(0,7)!==ui.calMonth)ui.calMonth=ui.calDay.slice(0,7);render();{const p=document.getElementById('day-panel');if(p&&window.innerWidth<=760)p.scrollIntoView({behavior:'smooth',block:'nearest'})}break;
  }
});
document.addEventListener('change',e=>{
  const tg=e.target.closest('[data-toggle]');if(tg){toggleTask(tg.dataset.toggle,tg.checked);return}
  const st=e.target.closest('[data-step]');if(st&&ui.draft){const i=Number(st.dataset.step);if(ui.draft.subtasks[i]){ui.draft.subtasks[i].done=st.checked;renderSteps()}return}
  if(e.target.id==='file-in'){const f=e.target.files[0];e.target.value='';if(!f)return;
    if(f.size>5e6){toast('Fichier trop volumineux.');return}
    const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.onerror=()=>toast('Lecture du fichier impossible.');r.readAsText(f)}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='step-new'&&e.key==='Enter'){e.preventDefault();addStep();return}
  const b=e.target.closest&&e.target.closest('.task__body');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(b.dataset.id)}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.gid)ui.groups[d.dataset.gid]=d.open},true);
$('#task-form').addEventListener('submit',submitTask);
$('#code-form').addEventListener('submit',submitCode);
$('#choice-dialog').addEventListener('close',()=>{if(choiceRes)endChoice(null)});
window.addEventListener('hashchange',render);
window.addEventListener('error',e=>{try{if(!$('#main').innerHTML.trim())showFatal(e.error||e.message)}catch(x){}});

/* ---------- Démarrage ---------- */
state=loadState();loadUi();
if(firstRun)persist();
render();
initSync();
setInterval(()=>{if(!document.querySelector('dialog[open]'))render()},300000);
window.__studio={get state(){return state},validate,render,today,SYNC,syncNow,mergeStates};
</script>
